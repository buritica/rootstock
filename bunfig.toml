[install]
# Never resolve a version published less than 3 days ago (Bun 1.3+). Most
# compromised npm releases are caught and unpublished inside that window.
# Only bites when a version is resolved (bun add/update, a lockfile change);
# `bun install --frozen-lockfile` installs what the lockfile already pins.
# Dependabot waits the same 3 days (.github/dependabot.yml cooldown).
minimumReleaseAge = 259200
