# Keeps pinned action SHAs and Bun dependencies current; bumps arrive as PRs
# and go through ci-pass like any other change.
#
# Scaffolded by the `sdlc` plugin (/sdlc:init). Lives at .github/dependabot.yml.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 3 days after a release before proposing it (security updates are
    # exempt). Matches bunfig's minimumReleaseAge, and most compromised npm
    # releases are caught and pulled within that window.
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      dev-deps:
        dependency-type: "development"
