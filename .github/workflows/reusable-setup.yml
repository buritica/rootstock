# Reusable workflow: bun install + cache, then one command. Every validation job
# in ci.yml shares this path. Hosted runners only (rootstock has no self-hosted
# runner).
#
# Scaffolded by the `sdlc` plugin (/sdlc:init), node-bun shape.
name: Setup

on:
  workflow_call:
    inputs:
      command:
        description: "Command to run after install"
        required: true
        type: string
      install-args:
        description: "Extra args for the install step"
        required: false
        default: "--frozen-lockfile"
        type: string
      bun-version:
        description: "Bun version for this job"
        required: false
        # Matches the Bun that writes bun.lock (lockfile v2 needs >= 1.4).
        default: "1.4.2"
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install ${{ inputs.install-args }}
      - run: ${{ inputs.command }}
