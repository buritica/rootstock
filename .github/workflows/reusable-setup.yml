# Reusable workflow: bun install + cache, then one command. Every validation job
# in ci.yml shares this path. Hosted runners only (rootstock has no self-hosted
# runner).
#
# Scaffolded by the `sdlc` plugin (/sdlc:init), node-bun shape.
name: Setup

on:
  workflow_call:
    inputs:
      command:
        description: "Command to run after install"
        required: true
        type: string
      install-args:
        description: "Extra args for the install step"
        required: false
        default: "--frozen-lockfile"
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Oldest Bun consumers run (compass's image pins 1.3.x); package.json
          # engines says >=1.3. Bump deliberately.
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install ${{ inputs.install-args }}
      - run: ${{ inputs.command }}
