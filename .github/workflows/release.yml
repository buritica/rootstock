# Publishes @buritica/rootstock to npm when a v* tag is pushed. Tags are
# immutable (repo ruleset), so a published version can never drift from its tag.
#
# Auth is npm trusted publishing: GitHub's OIDC token proves this workflow in
# this repo is the publisher. No npm token exists anywhere, and the package is
# set to disallow token publishes. Provenance is attached automatically.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile

      # Never publish a tree CI would reject.
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

      - name: Tag matches package.json version
        run: |
          version="$(jq -r .version package.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install --global npm@^11.5.1
      - run: npm publish --provenance --access public
